<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Margoplaats - Giełda Margonem</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Pasek nawigacji -->
  <nav class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500/20 border border-amber-500/50 p-2 rounded-lg text-amber-400">
          <i class="fa-solid fa-gavel text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">MARGOPLAATS</span>
          <span class="hidden sm:inline-block ml-2 text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Giełda PLN</span>
        </div>
      </div>

      <!-- Sekcja użytkownika / Logowanie Discord -->
      <div id="auth-section">
        <button onclick="loginWithDiscord()" class="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition shadow-lg shadow-[#5865F2]/25 cursor-pointer">
          <i class="fa-brands fa-discord"></i>
          <span>Zaloguj przez Discord</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Główna zawartość -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Nagłówek i filtry -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4 bg-slate-800/60 p-4 rounded-xl border border-slate-700/80">
      <div class="flex flex-wrap gap-3 w-full md:w-auto">
        <select id="filter-world" onchange="renderAuctions()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
          <option value="all">Wszystkie światy</option>
          <option value="Katahha">Katahha</option>
          <option value="Tarhuna">Tarhuna</option>
          <option value="Aldous">Aldous</option>
          <option value="Tempest">Tempest</option>
          <option value="Zorza">Zorza</option>
        </select>

        <select id="filter-category" onchange="renderAuctions()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
          <option value="all">Wszystkie kategorie</option>
          <option value="Legenda">Przedmiot: Legenda</option>
          <option value="Konto">Konto / Postać</option>
          <option value="Złoto">Złoto (m/g)</option>
        </select>
      </div>

      <button onclick="openAddModal()" class="w-full md:w-auto bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2 rounded-lg transition flex items-center justify-center space-x-2 cursor-pointer shadow-lg shadow-amber-500/20">
        <i class="fa-solid fa-plus"></i>
        <span>Wystaw aukcję</span>
      </button>
    </div>

    <!-- Lista aukcji -->
    <div id="auctions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Generowane przez JS -->
    </div>

  </main>

  <!-- Modal dodawania aukcji -->
  <div id="add-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-amber-400">Wystaw na sprzedaż</h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-white cursor-pointer">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <form onsubmit="addAuction(event)" class="space-y-4">
        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Nazwa przedmiotu / konta</label>
          <input type="text" id="item-title" required placeholder="np. Pierścień Mocy 120 lvl" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Kategoria</label>
            <select id="item-category" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
              <option value="Legenda">Legenda</option>
              <option value="Konto">Konto</option>
              <option value="Złoto">Złoto</option>
            </select>
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Świat</label>
            <select id="item-world" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
              <option value="Katahha">Katahha</option>
              <option value="Tarhuna">Tarhuna</option>
              <option value="Aldous">Aldous</option>
              <option value="Tempest">Tempest</option>
              <option value="Zorza">Zorza</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Cena wywoławcza (PLN)</label>
            <input type="number" id="item-price" required min="1" placeholder="50" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Kup Teraz (PLN)</label>
            <input type="number" id="item-buynow" required min="1" placeholder="120" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Krótki opis / Wymagania</label>
          <textarea id="item-desc" rows="2" placeholder="np. Czysty, bez przypisania, płatność BLIK." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-lg transition cursor-pointer">
          Opublikuj ofertę
        </button>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // KONFIGURACJA DISCORD OAUTH2 (Margoplaats)
    // ==========================================
    const DISCORD_CLIENT_ID = "1570417107181772890";
    const REDIRECT_URI = "https://wujakamil.github.io/Margoplaats/";

    let currentUser = JSON.parse(localStorage.getItem('margo_discord_user')) || null;

    // Przykładowe aukcje na start
    const defaultAuctions = [
      {
        id: 1,
        title: "Pierścień Mocy (120 lvl)",
        category: "Legenda",
        world: "Katahha",
        currentBid: 85,
        buyNow: 150,
        desc: "Legendarny pierścień, nieprzypisany. Szybka wymiana w Ithan.",
        seller: "Kamil#0001",
        lastBidder: "Brak ofert",
        bidsCount: 0
      },
      {
        id: 2,
        title: "Wojownik 215 lvl + EQ Heroik/Leg",
        category: "Konto",
        world: "Katahha",
        currentBid: 220,
        buyNow: 400,
        desc: "Konto bez wyrobionego klucza odzyskiwania, pełny dostęp.",
        seller: "HandlarzKatahha",
        lastBidder: "ZosiaSamosia",
        bidsCount: 3
      },
      {
        id: 3,
        title: "Pakiet 500m złota",
        category: "Złoto",
        world: "Tarhuna",
        currentBid: 40,
        buyNow: 65,
        desc: "Przekazanie przez bezpieczną aukcję w grze.",
        seller: "GoldFarmer",
        lastBidder: "Brak ofert",
        bidsCount: 0
      }
    ];

    let auctions = JSON.parse(localStorage.getItem('margoplaats_auctions')) || defaultAuctions;

    // Funkcja przekierowująca do logowania Discord
    function loginWithDiscord() {
      const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
      window.location.href = authUrl;
    }

    // Wylogowanie
    function logout() {
      localStorage.removeItem('margo_discord_user');
      currentUser = null;
      renderAuthSection();
    }

    // Odbieranie tokenu z paska adresu po powrocie z Discorda
    async function checkDiscordCallback() {
      if (window.location.hash.includes('access_token')) {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');
        const tokenType = fragment.get('token_type');

        // Czyszczenie adresu URL z tokenu
        window.history.replaceState({}, document.title, window.location.pathname);

        try {
          const response = await fetch('https://discord.com/api/users/@me', {
            headers: { authorization: `${tokenType} ${accessToken}` }
          });

          if (response.ok) {
            const data = await response.json();
            const avatarUrl = data.avatar
              ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`
              : `https://cdn.discordapp.com/embed/avatars/0.png`;

            currentUser = {
              id: data.id,
              username: data.global_name || data.username,
              tag: data.username,
              avatar: avatarUrl
            };

            localStorage.setItem('margo_discord_user', JSON.stringify(currentUser));
          }
        } catch (err) {
          console.error("Błąd autoryzacji Discord:", err);
        }
      }
      renderAuthSection();
      renderAuctions();
    }

    // Aktualizacja paska nawigacji (Zalogowany / Niezalogowany)
    function renderAuthSection() {
      const container = document.getElementById('auth-section');
      if (currentUser) {
        container.innerHTML = `
          <div class="flex items-center space-x-3 bg-slate-900/90 border border-slate-700 px-3 py-1.5 rounded-lg">
            <img src="${currentUser.avatar}" alt="Avatar" class="w-8 h-8 rounded-full border border-emerald-500">
            <div class="text-sm">
              <div class="font-bold text-white leading-tight flex items-center gap-1">
                ${currentUser.username}
                <i class="fa-solid fa-circle-check text-emerald-400 text-xs" title="Zweryfikowany przez Discord"></i>
              </div>
              <div class="text-xs text-slate-400">@${currentUser.tag}</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-400 ml-2 text-sm cursor-pointer" title="Wyloguj">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        `;
      } else {
        container.innerHTML = `
          <button onclick="loginWithDiscord()" class="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition shadow-lg shadow-[#5865F2]/25 cursor-pointer">
            <i class="fa-brands fa-discord"></i>
            <span>Zaloguj przez Discord</span>
          </button>
        `;
      }
    }

    // Wyświetlanie kart aukcji
    function renderAuctions() {
      const grid = document.getElementById('auctions-grid');
      const worldFilter = document.getElementById('filter-world').value;
      const catFilter = document.getElementById('filter-category').value;

      const filtered = auctions.filter(a => {
        const matchWorld = worldFilter === 'all' || a.world === worldFilter;
        const matchCat = catFilter === 'all' || a.category === catFilter;
        return matchWorld && matchCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Brak ofert spełniających kryteria.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        let badgeColor = "bg-amber-500/20 text-amber-400 border-amber-500/40";
        let icon = "fa-ring";
        if (item.category === "Konto") {
          badgeColor = "bg-purple-500/20 text-purple-400 border-purple-500/40";
          icon = "fa-user-shield";
        } else if (item.category === "Złoto") {
          badgeColor = "bg-yellow-500/20 text-yellow-300 border-yellow-500/40";
          icon = "fa-coins";
        }

        return `
          <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-amber-500/50 transition shadow-lg">
            <div>
              <div class="flex justify-between items-start mb-3">
                <span class="text-xs font-semibold px-2.5 py-1 rounded border ${badgeColor} flex items-center gap-1.5">
                  <i class="fa-solid ${icon}"></i> ${item.category}
                </span>
                <span class="text-xs bg-slate-900 text-slate-300 px-2.5 py-1 rounded border border-slate-700 font-medium">
                  Świat: ${item.world}
                </span>
              </div>

              <h3 class="text-lg font-bold text-white mb-2">${item.title}</h3>
              <p class="text-sm text-slate-400 mb-4">${item.desc}</p>
            </div>

            <div class="border-t border-slate-700/80 pt-4 mt-2">
              <div class="flex justify-between items-end mb-3">
                <div>
                  <span class="text-xs text-slate-400 block">Aktualna oferta (${item.bidsCount}):</span>
                  <span class="text-2xl font-extrabold text-amber-400">${item.currentBid} PLN</span>
                  <span class="text-xs text-slate-500 block">Licytuje: ${item.lastBidder}</span>
                </div>
                <div class="text-right">
                  <span class="text-xs text-slate-400 block">Kup Teraz:</span>
                  <span class="text-lg font-bold text-emerald-400">${item.buyNow} PLN</span>
                </div>
              </div>

              <div class="flex gap-2">
                <button onclick="placeBid(${item.id})" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2 rounded-lg text-sm transition cursor-pointer">
                  Podbij (+10 PLN)
                </button>
                <button onclick="buyNow(${item.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg text-sm transition cursor-pointer">
                  Kup Teraz
                </button>
              </div>

              <div class="mt-3 text-xs text-slate-500 flex justify-between items-center">
                <span>Wystawił: <strong class="text-slate-300">${item.seller}</strong></span>
                <span class="text-emerald-400 flex items-center gap-1"><i class="fa-brands fa-discord"></i> Zweryfikowany</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Licytowanie
    function placeBid(id) {
      if (!currentUser) {
        alert("Musisz zalogować się przez Discord, aby brać udział w licytacji!");
        return;
      }
      const item = auctions.find(a => a.id === id);
      if (item) {
        item.currentBid += 10;
        item.bidsCount += 1;
        item.lastBidder = currentUser.username;
        localStorage.setItem('margoplaats_auctions', JSON.stringify(auctions));
        renderAuctions();
      }
    }

    // Kup Teraz
    function buyNow(id) {
      if (!currentUser) {
        alert("Musisz zalogować się przez Discord, aby kupić przedmiot!");
        return;
      }
      const item = auctions.find(a => a.id === id);
      if (item && confirm(`Czy na pewno chcesz kupić "${item.title}" za ${item.buyNow} PLN?`)) {
        alert(`Gratulacje ${currentUser.username}! Kupiłeś przedmiot. Skontaktuj się ze sprzedawcą (${item.seller}) na Discordzie.`);
        auctions = auctions.filter(a => a.id !== id);
        localStorage.setItem('margoplaats_auctions', JSON.stringify(auctions));
        renderAuctions();
      }
    }

    // Obsługa modala dodawania
    function openAddModal() {
      if (!currentUser) {
        alert("Zaloguj się przez Discord, aby wystawić przedmiot!");
        return;
      }
      document.getElementById('add-modal').classList.remove('hidden');
      document.getElementById('add-modal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
      document.getElementById('add-modal').classList.remove('flex');
    }

    function addAuction(e) {
      e.preventDefault();
      const newAuction = {
        id: Date.now(),
        title: document.getElementById('item-title').value,
        category: document.getElementById('item-category').value,
        world: document.getElementById('item-world').value,
        currentBid: Number(document.getElementById('item-price').value),
        buyNow: Number(document.getElementById('item-buynow').value),
        desc: document.getElementById('item-desc').value || "Brak dodatkowego opisu.",
        seller: currentUser.username,
        lastBidder: "Brak ofert",
        bidsCount: 0
      };

      auctions.unshift(newAuction);
      localStorage.setItem('margoplaats_auctions', JSON.stringify(auctions));
      closeAddModal();
      e.target.reset();
      renderAuctions();
    }

    window.addEventListener('DOMContentLoaded', checkDiscordCallback);
  </script>
</body>
</html>
