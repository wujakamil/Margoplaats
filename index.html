  <script>
    // ==========================================
    // 1. KONFIGURACJA DISCORD & SUPABASE
    // ==========================================
    const DISCORD_CLIENT_ID = "1570417107181772890";
    const REDIRECT_URI = "https://wujakamil.github.io/Margoplaats/";

    const SUPABASE_URL = "https://nyiojlbcrtkamcgclomn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55aW9qbGJjcnRrYW1jZ2Nsb21uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0ODI5NTEsImV4cCI6MjExMDA1ODk1MX0.FZh5jhc-6VvSLwL0_Y4I0Wpee103Wy_tP740Uv4lmEk";

    // Domyślny Zaufany Handlarz
    const DEFAULT_MIDDLEMAN = "Wuja Kamil (@wujakamil)";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(localStorage.getItem('margo_discord_user')) || null;
    let activeCategory = 'all';
    let auctions = [];
    let slideIndexMap = {}; // przechowuje aktualny numer zdjęcia dla każdej aukcji

    // ==========================================
    // 2. LOGOWANIE DISCORD OAUTH2
    // ==========================================
    function loginWithDiscord() {
      const authUrl = `https://discord.com/api/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
      window.location.href = authUrl;
    }

    function logout() {
      localStorage.removeItem('margo_discord_user');
      currentUser = null;
      renderAuthSection();
      renderAuctions();
    }

    async function checkDiscordCallback() {
      if (window.location.hash.includes('access_token')) {
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const accessToken = fragment.get('access_token');
        const tokenType = fragment.get('token_type');

        window.history.replaceState({}, document.title, window.location.pathname);

        try {
          const response = await fetch('https://discord.com/api/users/@me', {
            headers: { authorization: `${tokenType} ${accessToken}` }
          });

          if (response.ok) {
            const data = await response.json();
            const avatarUrl = data.avatar
              ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`
              : `https://cdn.discordapp.com/embed/avatars/0.png`;

            currentUser = {
              id: data.id,
              username: data.global_name || data.username,
              tag: data.username,
              avatar: avatarUrl
            };

            localStorage.setItem('margo_discord_user', JSON.stringify(currentUser));
          }
        } catch (err) {
          console.error("Błąd autoryzacji Discord:", err);
        }
      }
      renderAuthSection();
      await fetchAuctions();
      subscribeToRealtime();
    }

    function renderAuthSection() {
      const container = document.getElementById('auth-section');
      if (currentUser) {
        container.innerHTML = `
          <div class="flex items-center space-x-3 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg">
            <img src="${currentUser.avatar}" alt="Avatar" class="w-8 h-8 rounded-full border border-emerald-500">
            <div class="text-sm">
              <div class="font-bold text-white leading-tight flex items-center gap-1">
                ${currentUser.username}
                <i class="fa-solid fa-circle-check text-emerald-400 text-xs" title="Zweryfikowany przez Discord"></i>
              </div>
              <div class="text-xs text-slate-400">@${currentUser.tag}</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-400 ml-2 text-sm cursor-pointer" title="Wyloguj">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>

      } else {
        container.innerHTML = `
          <button onclick="loginWithDiscord()" class="bg-[#5865F2] hover:bg-[#4752C4] text-white px-4 py-2 rounded-lg font-medium flex items-center space-x-2 transition shadow-lg shadow-[#5865F2]/25 cursor-pointer text-sm">

    // ==========================================
    // 3. PARSOWANIE DODATKOWYCH DANYCH (LVL, ZDJĘCIA, DISCORD ID)
    // ==========================================
    function parseAuctionMeta(item) {
      let rawDesc = item.description || item.desc || "";
      let meta = { lvl: null, discordTag: item.seller, discordId: "", middleman: true };

      // Odczyt zaszytego bloku meta z opisu (kompatybilne ze standardową tabelą Supabase)
      if (rawDesc.includes("|||META:")) {
        const parts = rawDesc.split("|||META:");
        rawDesc = parts[0];
        try {
          const parsed = JSON.parse(parts[1]);
          meta = { ...meta, ...parsed };
        } catch (e) {}
      }

      // Jeśli lvl nie był w meta, spróbuj wyciągnąć z tytułu np. "(120 lvl)"
      if (!meta.lvl) {
        const match = item.title.match(/(\d+)\s*lvl/i);
        if (match) meta.lvl = Number(match[1]);
      }

      // Parsowanie wielu zdjęć (tablica JSON lub rozdzielone przecinkiem/nową linią)
      let images = [];
      if (item.img) {
        try {
          const parsedImg = JSON.parse(item.img);
          if (Array.isArray(parsedImg)) images = parsedImg;
        } catch (e) {
          images = item.img.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
        }
      }

      return { cleanDesc: rawDesc || "Brak opisu.", meta, images };
    }

    // ==========================================
    // 4. POBIERANIE I WYŚWIETLANIE AUKCJI
    // ==========================================
    async function fetchAuctions() {
      const { data, error } = await supabaseClient
        .from('auctions')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Błąd pobierania aukcji:", error);
        return;
      }

      auctions = data || [];
      renderAuctions();
    }

    function subscribeToRealtime() {
      supabaseClient
        .channel('public:auctions')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'auctions' }, () => {
          fetchAuctions();
        })
        .subscribe();

      setInterval(fetchAuctions, 10000);
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = "cat-btn bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition cursor-pointer flex items-center gap-2";
        } else {
          btn.className = "cat-btn bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2 rounded-lg text-sm transition cursor-pointer flex items-center gap-2";
        }
      });
      renderAuctions();
    }

    // Zmiana zdjęcia w karuzeli na karcie
    function changeSlide(auctionId, dir, total) {
      const current = slideIndexMap[auctionId] || 0;
      slideIndexMap[auctionId] = (current + dir + total) % total;
      renderAuctions();
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-modal').classList.remove('hidden');
      document.getElementById('lightbox-modal').classList.add('flex');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.add('hidden');
      document.getElementById('lightbox-modal').classList.remove('flex');
    }

    function renderAuctions() {
      const grid = document.getElementById('auctions-grid');
      const worldFilter = document.getElementById('filter-world').value;
      const currencyFilter = document.getElementById('filter-currency').value;
      const searchQuery = document.getElementById('filter-search').value.toLowerCase().trim();
      const minLvl = Number(document.getElementById('filter-min-lvl').value) || 0;
      const maxLvl = Number(document.getElementById('filter-max-lvl').value) || 9999;

      const filtered = auctions.filter(a => {
        const { cleanDesc, meta } = parseAuctionMeta(a);
        const matchWorld = worldFilter === 'all' || a.world === worldFilter;
        const matchCat = activeCategory === 'all' || a.category === activeCategory;
        const matchCurr = currencyFilter === 'all' || a.currency === currencyFilter;
        const matchSearch = !searchQuery || a.title.toLowerCase().includes(searchQuery) || cleanDesc.toLowerCase().includes(searchQuery);
        
        let matchLvl = true;
        if (minLvl > 0 || maxLvl < 9999) {
          const itemLvl = meta.lvl || 0;
          matchLvl = itemLvl >= minLvl && itemLvl <= maxLvl;
        }

        return matchWorld && matchCat && matchCurr && matchSearch && matchLvl;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-slate-900/50 border border-slate-800 rounded-xl text-center py-12 text-slate-400">
            <i class="fa-solid fa-box-open text-3xl mb-2 text-slate-600 block"></i>
            Brak aktywnych ofert dla wybranych filtrów (sprawdź przedział LVL lub walutę).
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const { cleanDesc, meta, images } = parseAuctionMeta(item);

        let badgeColor = "bg-amber-500/20 text-amber-400 border-amber-500/40";
        let icon = "fa-shield-halved";
        if (item.category === "Konta") {
          badgeColor = "bg-purple-500/20 text-purple-400 border-purple-500/40";
          icon = "fa-user-ninja";
        } else if (item.category === "Złoto") {
          badgeColor = "bg-yellow-500/20 text-yellow-300 border-yellow-500/40";
          icon = "fa-coins";
        }

        // Galeria kilku zdjęć na karcie
        let galleryHtml = '';
        if (images.length > 0) {
          const currentIndex = (slideIndexMap[item.id] || 0) % images.length;
          const currentImg = images[currentIndex];
          const navBtns = images.length > 1 ? `
            <button onclick="changeSlide(${item.id}, -1, ${images.length})" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center text-xs cursor-pointer">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button onclick="changeSlide(${item.id}, 1, ${images.length})" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-black text-white w-7 h-7 rounded-full flex items-center justify-center text-xs cursor-pointer">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
            <span class="absolute bottom-2 right-2 bg-black/75 text-white text-[11px] px-2 py-0.5 rounded font-medium">
              <i class="fa-regular fa-images mr-1"></i>${currentIndex + 1}/${images.length}
            </span>
          ` : '';

          galleryHtml = `
            <div class="relative mb-3 group">
              <img src="${currentImg}" onclick="openLightbox('${currentImg}')" alt="${item.title}" class="w-full h-44 object-cover rounded-lg border border-slate-700 cursor-zoom-in">
              ${navBtns}
            </div>
          `;
        }

        const lvlBadge = meta.lvl
          ? `<span class="text-xs bg-amber-500/15 text-amber-300 border border-amber-500/30 px-2 py-1 rounded font-bold">LVL ${meta.lvl}</span>`
          : '';

        const middlemanBadge = meta.middleman
          ? `<div class="mt-2 text-[11px] bg-indigo-950/60 border border-indigo-700/50 text-indigo-300 px-2.5 py-1 rounded flex items-center gap-1.5">
               <i class="fa-solid fa-user-check text-indigo-400"></i> Dostępny Zaufany Handlarz (Middleman)
             </div>`
          : '';

        const isOwner = currentUser && (currentUser.username === item.seller || currentUser.tag === meta.discordTag);
        const deleteBtn = isOwner
          ? `<button onclick="deleteAuction(${item.id})" class="text-xs text-red-400 hover:text-red-300 cursor-pointer ml-2" title="Usuń swoją ofertę"><i class="fa-solid fa-trash"></i></button>`
          : '';

        const suggestedMinBid = Number((Number(item.currentBid) + (item.currency === 'g' ? 0.5 : 1)).toFixed(2));

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-amber-500/50 transition shadow-lg">
            <div>
              <div class="flex justify-between items-center gap-2 mb-3 flex-wrap">
                <div class="flex items-center gap-1.5">
                  <span class="text-xs font-semibold px-2.5 py-1 rounded border ${badgeColor} flex items-center gap-1.5">
                    <i class="fa-solid ${icon}"></i> ${item.category}
                  </span>
                  ${lvlBadge}
                </div>
                <span class="text-xs bg-slate-950 text-slate-300 px-2.5 py-1 rounded border border-slate-800 font-medium">
                  🌍 ${item.world}
                </span>
              </div>

              ${galleryHtml}

              <h3 class="text-lg font-bold text-white mb-1">${item.title}</h3>
              <p class="text-sm text-slate-400 mb-2">${cleanDesc}</p>
              ${middlemanBadge}
            </div>

            <div class="border-t border-slate-800 pt-4 mt-4">
              <div class="flex justify-between items-end mb-3">
                <div>
                  <span class="text-xs text-slate-400 block">Aktualna oferta (${item.bidsCount || 0}):</span>
                  <span class="text-2xl font-extrabold text-amber-400">${item.currentBid} ${item.currency}</span>
                  <span class="text-xs text-slate-500 block">Licytuje: <strong class="text-slate-300">${item.lastBidder}</strong></span>
                </div>
                <div class="text-right">
                  <span class="text-xs text-slate-400 block">Kup Teraz:</span>
                  <span class="text-lg font-bold text-emerald-400">${item.buyNow} ${item.currency}</span>
                </div>
              </div>

              <!-- Dowolna licytacja kwotowa + Kup Teraz -->
              <div class="space-y-2">
                <div class="flex gap-2">
                  <div class="relative flex-1">
                    <input type="number" step="any" id="bid-input-${item.id}" placeholder="Min. ${suggestedMinBid}" class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-3 pr-10 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    <span class="absolute right-2.5 top-2 text-xs text-slate-400 font-bold">${item.currency}</span>
                  </div>
                  <button onclick="placeCustomBid(${item.id})" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition cursor-pointer whitespace-nowrap">
                    Licytuj
                  </button>
                </div>

                <button onclick="openBuyModal(${item.id})" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-lg text-sm transition cursor-pointer flex items-center justify-center gap-2">
                  <i class="fa-solid fa-cart-shopping"></i> Kup Teraz / Kontakt ze sprzedawcą
                </button>
              </div>

              <div class="mt-3 text-xs text-slate-500 flex justify-between items-center">
                <span>Sprzedaje: <strong class="text-slate-300">${item.seller}</strong> ${deleteBtn}</span>
                <span class="text-emerald-400 flex items-center gap-1"><i class="fa-brands fa-discord"></i> @${meta.discordTag}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // 5. DOWOLNA LICYTACJA KWOTOWA
    // ==========================================
    async function placeCustomBid(id) {
      if (!currentUser) {
        alert("Zaloguj się przez Discord, aby licytować!");
        return;
      }
      const item = auctions.find(a => a.id === id);
      if (!item) return;

      const inputEl = document.getElementById(`bid-input-${id}`);
      const customAmount = Number(inputEl.value);

      if (!customAmount || customAmount <= Number(item.currentBid)) {
        alert(`Twoja oferta musi być wyższa niż aktualna kwota (${item.currentBid} ${item.currency})!`);
        return;
      }

      if (customAmount >= Number(item.buyNow)) {
        if (confirm(`Wpisana kwota (${customAmount} ${item.currency}) osiąga lub przekracza cenę Kup Teraz (${item.buyNow} ${item.currency}). Przejść od razu do zakupu?`)) {
          openBuyModal(id);
        }
        return;
      }

      const { error } = await supabaseClient
        .from('auctions')
        .update({
          currentBid: customAmount,
          bidsCount: (item.bidsCount || 0) + 1,
          lastBidder: currentUser.username
        })
        .eq('id', id);

      if (error) {
        alert("Błąd podczas licytacji: " + error.message);
        return;
      }

      sendDiscordWebhook(`🔨 **Nowa oferta!** Gracz **${currentUser.username}** (@${currentUser.tag}) zalicytował **${customAmount} ${item.currency}** za **${item.title}** (Świat: ${item.world})!`);
      await fetchAuctions();
    }

    // ==========================================
    // 6. OKNO KUP TERAZ, DANE SPRZEDAWCY I ZAUFANY HANDLARZ
    // ==========================================
    function openBuyModal(id) {
      if (!currentUser) {
        alert("Zaloguj się przez Discord, aby zobaczyć dane sprzedawcy i kupić przedmiot!");
        return;
      }
      const item = auctions.find(a => a.id === id);
      if (!item) return;

      const { meta } = parseAuctionMeta(item);
      const middlemanName = localStorage.getItem('margo_middleman_tag') || DEFAULT_MIDDLEMAN;

      const discordProfileBtn = meta.discordId
        ? `<a href="discord://-/users/${meta.discordId}" class="w-full bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-2 transition">
             <i class="fa-brands fa-discord"></i> Otwórz czat ze sprzedawcą w aplikacji Discord
           </a>`
        : '';

      const container = document.getElementById('buy-modal-content');
      container.innerHTML = `
        <div class="bg-slate-950 border border-slate-800 rounded-lg p-3">
          <div class="text-xs text-slate-400">Kupujesz ofertę (Świat: ${item.world}):</div>
          <div class="font-bold text-white text-base">${item.title}</div>
          <div class="text-emerald-400 font-extrabold text-lg mt-1">Cena Kup Teraz: ${item.buyNow} ${item.currency}</div>
        </div>

        <!-- Wizytówka Discord sprzedawcy -->
        <div class="bg-slate-950 border border-[#5865F2]/40 rounded-lg p-3.5 space-y-2.5">
          <div class="text-xs uppercase tracking-wider text-slate-400 font-semibold flex items-center gap-1.5">
            <i class="fa-brands fa-discord text-[#5865F2]"></i> Dane kontaktowe sprzedawcy:
          </div>
          <div class="flex justify-between items-center bg-slate-900 px-3 py-2 rounded border border-slate-800">
            <div>
              <div class="text-sm font-bold text-white">${item.seller}</div>
              <div class="text-xs text-amber-400 font-mono" id="seller-tag-copy">@${meta.discordTag}</div>
            </div>
            <button onclick="navigator.clipboard.writeText('${meta.discordTag}'); alert('Skopiowano nick Discord: ${meta.discordTag}');" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded border border-slate-700 cursor-pointer flex items-center gap-1">
              <i class="fa-regular fa-copy"></i> Kopiuj nick
            </button>
          </div>
          ${discordProfileBtn}
        </div>

        <!-- Opcja wymiany przez Zaufanego Handlarza -->
        <div class="bg-indigo-950/40 border border-indigo-700/50 rounded-lg p-3.5 space-y-2">
          <label class="flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" id="use-middleman-checkbox" ${meta.middleman ? 'checked' : ''} class="w-4 h-4 mt-0.5 accent-amber-500 rounded">
            <div class="text-xs">
              <span class="font-bold text-indigo-300 block">Wymiana przez Zaufanego Handlarza (Middleman)</span>
              <span class="text-slate-400">Automatycznie wyśle prośbę na serwer Discord o utworzenie wspólnego kanału/ticketu dla Ciebie, sprzedającego (<strong>@${meta.discordTag}</strong>) oraz handlarza (<strong>${middlemanName}</strong>).</span>
            </div>
          </label>
        </div>

        <div class="flex gap-2 pt-2">
          <button onclick="confirmPurchase(${item.id})" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm transition cursor-pointer">
            Potwierdzam zakup (+ Wyślij Ticket)
          </button>
          <button onclick="closeBuyModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-lg text-sm transition cursor-pointer">
            Anuluj
          </button>
        </div>
      `;

      document.getElementById('buy-modal').classList.remove('hidden');
      document.getElementById('buy-modal').classList.add('flex');
    }

    function closeBuyModal() {
      document.getElementById('buy-modal').classList.add('hidden');
      document.getElementById('buy-modal').classList.remove('flex');
    }

    async function confirmPurchase(id) {
      const item = auctions.find(a => a.id === id);
      if (!item) return;

      const { meta } = parseAuctionMeta(item);
      const useMiddleman = document.getElementById('use-middleman-checkbox').checked;
      const middlemanName = localStorage.getItem('margo_middleman_tag') || DEFAULT_MIDDLEMAN;

      const buyerMention = currentUser.id ? `<@${currentUser.id}> (@${currentUser.tag})` : `**${currentUser.username}** (@${currentUser.tag})`;
      const sellerMention = meta.discordId ? `<@${meta.discordId}> (@${meta.discordTag})` : `**${item.seller}** (@${meta.discordTag})`;

      if (useMiddleman) {
        sendDiscordWebhook(
          `🛡️ **NOWY TICKET HANDLOWY (ZAUFANY HANDLARZ)** 🛡️\n` +
          `📦 Przedmiot: **${item.title}** (Świat: **${item.world}**)\n` +
          `💰 Kwota: **${item.buyNow} ${item.currency}**\n` +
          `👤 Kupujący: ${buyerMention}\n` +
          `👤 Sprzedający: ${sellerMention}\n` +
          `🤝 Zaufany Handlarz: **${middlemanName}**\n` +
          `👉 *Proszę o utworzenie prywatnego kanału/wątku dla powyższej trójki w celu przeprowadzenia bezpiecznej wymiany!*`
        );
      } else {
        sendDiscordWebhook(
          `✅ **SPRZEDANE (KUP TERAZ)!**\n` +
          `📦 **${item.title}** (${item.world}) za **${item.buyNow} ${item.currency}**\n` +
          `👤 Kupił: ${buyerMention} od ${sellerMention}`
        );
      }

      const { error } = await supabaseClient.from('auctions').delete().eq('id', id);
      if (error) {
        alert("Błąd podczas finalizacji zakupu: " + error.message);
        return;
      }

      closeBuyModal();
      alert(`Zakup potwierdzony! Skontaktuj się ze sprzedawcą (@${meta.discordTag}) na Discordzie${useMiddleman ? ' lub poczekaj na otwarcie kanału z Zaufanym Handlarzem.' : '.'}`);
      await fetchAuctions();
    }

    // Usuwanie własnej aukcji
    async function deleteAuction(id) {
      if (!confirm("Czy na pewno chcesz usunąć swoją aukcję?")) return;
      const { error } = await supabaseClient.from('auctions').delete().eq('id', id);
      if (!error) await fetchAuctions();
    }

    // ==========================================
    // 7. DODAWANIE NOWEJ AUKCJI (WIELE ZDJĘĆ, LVL, WALUTY)
    // ==========================================
    async function addAuction(e) {
      e.preventDefault();
      const price = Number(document.getElementById('item-price').value);
      const buyNow = Number(document.getElementById('item-buynow').value);

      if (buyNow <= price) {
        alert("Cena Kup Teraz musi być wyższa niż cena wywoławcza!");
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Publikowanie...";

      const rawImgs = document.getElementById('item-imgs').value;
      const imgList = rawImgs.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);

      const lvlVal = Number(document.getElementById('item-lvl').value) || null;
      const cleanDesc = document.getElementById('item-desc').value.trim() || "Brak dodatkowego opisu.";
      const allowMiddleman = document.getElementById('item-middleman').checked;

      // Pakujemy metadane (LVL, Discord Tag, Discord ID, Middleman), by nie trzeba było zmieniać struktury bazy
      const metaObj = {
        lvl: lvlVal,
        discordTag: currentUser.tag,
        discordId: currentUser.id,
        middleman: allowMiddleman
      };

      const packedDescription = `${cleanDesc}|||META:${JSON.stringify(metaObj)}`;

      const newAuction = {
        title: document.getElementById('item-title').value,
        category: document.getElementById('item-category').value,
        world: document.getElementById('item-world').value,
        currency: document.getElementById('item-currency').value,
        currentBid: price,
        buyNow: buyNow,
        img: JSON.stringify(imgList),
        description: packedDescription,
        seller: currentUser.username,
        lastBidder: "Brak ofert",
        bidsCount: 0
      };

      const { error } = await supabaseClient.from('auctions').insert([newAuction]);

      btn.disabled = false;
      btn.innerText = "Opublikuj ofertę";

      if (error) {
        alert("Błąd zapisu do bazy: " + error.message);
        return;
      }

      closeAddModal();
      e.target.reset();
      await fetchAuctions();

      sendDiscordWebhook(
        `📢 **Nowa aukcja na Margoplaats!**\n` +
        `📦 **${newAuction.title}** ${lvlVal ? `(LVL ${lvlVal})` : ''} | Kategoria: **${newAuction.category}** | Świat: **${newAuction.world}**\n` +
        `💰 Wywoławcza: **${newAuction.currentBid} ${newAuction.currency}** | Kup Teraz: **${newAuction.buyNow} ${newAuction.currency}**\n` +
        `👤 Wystawił: **${currentUser.username}** (@${currentUser.tag})\n` +
        `🔗 Link: ${REDIRECT_URI}`
      );
    }

    function openAddModal() {
      if (!currentUser) {
        alert("Zaloguj się przez Discord, aby wystawić ofertę!");
        return;
      }
      document.getElementById('add-modal').classList.remove('hidden');
      document.getElementById('add-modal').classList.add('flex');
    }

    function closeAddModal() {
      document.getElementById('add-modal').classList.add('hidden');
      document.getElementById('add-modal').classList.remove('flex');
    }

    function openWebhookModal() {
      document.getElementById('webhook-url-input').value = localStorage.getItem('margo_webhook_url') || '';
      document.getElementById('middleman-tag-input').value = localStorage.getItem('margo_middleman_tag') || DEFAULT_MIDDLEMAN;
      document.getElementById('webhook-modal').classList.remove('hidden');
      document.getElementById('webhook-modal').classList.add('flex');
    }

    function closeWebhookModal() {
      document.getElementById('webhook-modal').classList.add('hidden');
      document.getElementById('webhook-modal').classList.remove('flex');
    }

    function saveWebhook() {
      const url = document.getElementById('webhook-url-input').value.trim();
      const middleman = document.getElementById('middleman-tag-input').value.trim() || DEFAULT_MIDDLEMAN;
      localStorage.setItem('margo_webhook_url', url);
      localStorage.setItem('margo_middleman_tag', middleman);
      closeWebhookModal();
      if (url) {
        sendDiscordWebhook(`✅ **System Margoplaats połączony!** Aktualny Zaufany Handlarz: **${middleman}**`);
        alert("Zapisano ustawienia Webhooka i Zaufanego Handlarza!");
      }
    }

    function sendDiscordWebhook(content) {
      const webhookUrl = localStorage.getItem('margo_webhook_url');
      if (!webhookUrl) return;
      fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: "Margoplaats Bot", content: content })
      }).catch(err => console.error("Błąd wysyłania Webhooka:", err));
    }

    window.addEventListener('DOMContentLoaded', checkDiscordCallback);
  </script>
